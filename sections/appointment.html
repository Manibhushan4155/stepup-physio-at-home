<section id="appointment" class="py-20 bg-slate-950 text-white">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">

    <div class="text-center max-w-2xl mx-auto mb-12">
      <span class="text-xs font-extrabold uppercase tracking-wider text-teal-300 bg-teal-500/15 border border-teal-400/30 px-3 py-1 rounded-full">
        Book Home Physiotherapy
      </span>
      <h2 class="text-3xl sm:text-4xl font-extrabold text-white mt-3">
        Schedule Your Visit at Home
      </h2>
      <p class="text-slate-300 mt-3 text-sm sm:text-base">
        Choose your condition, preferred date &amp; slot, and pin your home location in Noida or Delhi NCR.
      </p>
    </div>

    <form id="appointmentForm" onsubmit="handleAppointmentSubmit(event)" class="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl space-y-8">

      <!-- Patient Basic Details -->
      <div class="grid sm:grid-cols-2 gap-6">
        <div>
          <label for="patientName" class="block text-xs font-extrabold uppercase tracking-wider text-slate-300 mb-2">
            Patient Name *
          </label>
          <input
            type="text"
            id="patientName"
            name="patientName"
            required
            placeholder="Enter patient full name"
            class="w-full px-4 py-3 rounded-xl bg-slate-950/90 border border-slate-700 text-white placeholder-slate-500 focus:border-teal-400 focus:outline-none"
          />
        </div>

        <div>
          <label for="patientPhone" class="block text-xs font-extrabold uppercase tracking-wider text-slate-300 mb-2">
            Phone / WhatsApp Number *
          </label>
          <input
            type="tel"
            id="patientPhone"
            name="patientPhone"
            required
            placeholder="10-digit mobile number"
            class="w-full px-4 py-3 rounded-xl bg-slate-950/90 border border-slate-700 text-white placeholder-slate-500 focus:border-teal-400 focus:outline-none"
          />
        </div>
      </div>

      <!-- Conditions / Services -->
      <div>
        <span class="block text-xs font-extrabold uppercase tracking-wider text-slate-300 mb-3">
          Condition(s) / Service Required *
        </span>
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 text-sm">
          <label class="flex items-center gap-2.5 bg-slate-950/70 border border-slate-800 hover:border-teal-500/50 rounded-xl px-4 py-3 cursor-pointer">
            <input type="checkbox" name="problemOption" value="Neck Pain & Back Pain" class="accent-teal-500 w-4 h-4" />
            <span>Neck Pain &amp; Back Pain</span>
          </label>

          <label class="flex items-center gap-2.5 bg-slate-950/70 border border-slate-800 hover:border-teal-500/50 rounded-xl px-4 py-3 cursor-pointer">
            <input type="checkbox" name="problemOption" value="Knee Pain & Shoulder Pain" class="accent-teal-500 w-4 h-4" />
            <span>Knee Pain &amp; Shoulder Pain</span>
          </label>

          <label class="flex items-center gap-2.5 bg-slate-950/70 border border-slate-800 hover:border-teal-500/50 rounded-xl px-4 py-3 cursor-pointer">
            <input type="checkbox" name="problemOption" value="Frozen Shoulder" class="accent-teal-500 w-4 h-4" />
            <span>Frozen Shoulder</span>
          </label>

          <label class="flex items-center gap-2.5 bg-slate-950/70 border border-slate-800 hover:border-teal-500/50 rounded-xl px-4 py-3 cursor-pointer">
            <input type="checkbox" name="problemOption" value="Postoperative Rehab (TKR, THR)" class="accent-teal-500 w-4 h-4" />
            <span>Postoperative Rehab (TKR, THR)</span>
          </label>

          <label class="flex items-center gap-2.5 bg-slate-950/70 border border-slate-800 hover:border-teal-500/50 rounded-xl px-4 py-3 cursor-pointer">
            <input type="checkbox" name="problemOption" value="Orthopaedic Rehabilitation" class="accent-teal-500 w-4 h-4" />
            <span>Orthopaedic Rehabilitation</span>
          </label>

          <label class="flex items-center gap-2.5 bg-slate-950/70 border border-slate-800 hover:border-teal-500/50 rounded-xl px-4 py-3 cursor-pointer">
            <input type="checkbox" name="problemOption" value="Neurological Rehab (Stroke, Parkinsonism)" class="accent-teal-500 w-4 h-4" />
            <span>Neurological Rehab</span>
          </label>

          <label class="flex items-center gap-2.5 bg-slate-950/70 border border-slate-800 hover:border-teal-500/50 rounded-xl px-4 py-3 cursor-pointer">
            <input type="checkbox" name="problemOption" value="Cupping & Manual Therapy" class="accent-teal-500 w-4 h-4" />
            <span>Cupping &amp; Manual Therapy</span>
          </label>

          <label class="flex items-center gap-2.5 bg-slate-950/70 border border-slate-800 hover:border-teal-500/50 rounded-xl px-4 py-3 cursor-pointer">
            <input type="checkbox" name="problemOption" value="Ergonomic Training & Geriatric Care" class="accent-teal-500 w-4 h-4" />
            <span>Ergonomic &amp; Geriatric Care</span>
          </label>

          <label class="flex items-center gap-2.5 bg-slate-950/70 border border-slate-800 hover:border-teal-500/50 rounded-xl px-4 py-3 cursor-pointer">
            <input type="checkbox" id="otherProblemCheck" name="problemOption" value="Other" onchange="toggleOtherInput()" class="accent-teal-500 w-4 h-4" />
            <span>Other</span>
          </label>
        </div>

        <div id="otherProblemBox" class="hidden mt-4">
          <input
            type="text"
            id="otherProblemText"
            placeholder="Specify other condition or requirement"
            class="w-full px-4 py-3 rounded-xl bg-slate-950/90 border border-slate-700 text-white placeholder-slate-500 focus:border-teal-400 focus:outline-none"
          />
        </div>
      </div>

      <!-- Preferred Date, Time Slot & Plan -->
      <div class="grid sm:grid-cols-3 gap-6">
        <div>
          <label for="patientDate" class="block text-xs font-extrabold uppercase tracking-wider text-slate-300 mb-2">
            PREFERRED DATE *
          </label>
          <input
            type="date"
            id="patientDate"
            name="patientDate"
            required
            onclick="openDateCalendar(this)"
            class="w-full px-4 py-3 rounded-xl bg-slate-950/90 border border-slate-700 text-white focus:border-teal-400 focus:outline-none [color-scheme:dark] cursor-pointer"
          />
        </div>

        <div>
          <label for="patientSlot" class="block text-xs font-extrabold uppercase tracking-wider text-slate-300 mb-2">
            PREFERRED TIME SLOT *
          </label>
          <select
            id="patientSlot"
            name="patientSlot"
            required
            class="w-full px-4 py-3 rounded-xl bg-slate-950/90 border border-slate-700 text-white focus:border-teal-400 focus:outline-none cursor-pointer"
          >
            <option value="">Select Time Slot</option>
            <option value="Morning (8:00 AM - 12:00 PM)">Morning (8:00 AM - 12:00 PM)</option>
            <option value="Afternoon (12:00 PM - 4:00 PM)">Afternoon (12:00 PM - 4:00 PM)</option>
            <option value="Evening (4:00 PM - 8:30 PM)">Evening (4:00 PM - 8:30 PM)</option>
          </select>
        </div>

        <div>
          <label for="selectedPlan" class="block text-xs font-extrabold uppercase tracking-wider text-slate-300 mb-2">
            SELECT PLAN
          </label>
          <select
            id="selectedPlan"
            name="selectedPlan"
            onchange="toggleOtherPlanInput()"
            class="w-full px-4 py-3 rounded-xl bg-slate-950/90 border border-slate-700 text-white focus:border-teal-400 focus:outline-none cursor-pointer"
          >
            <option value="Single Session">Single Session</option>
            <option value="7-Day Recovery Plan">7-Day Recovery Plan</option>
            <option value="14-Day Rehab Plan">14-Day Rehab Plan</option>
            <option value="30-Day Complete Care">30-Day Complete Care</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div id="otherPlanBox" class="hidden">
        <input
          type="text"
          id="otherPlanText"
          placeholder="Enter custom plan or session count"
          class="w-full px-4 py-3 rounded-xl bg-slate-950/90 border border-slate-700 text-white placeholder-slate-500 focus:border-teal-400 focus:outline-none"
        />
      </div>

      <!-- Home Address & Interactive Map -->
      <div class="space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <label for="patientLocation" class="text-xs font-extrabold uppercase tracking-wider text-slate-300">
            HOME ADDRESS IN NOIDA / DELHI NCR *
          </label>
          <div class="flex flex-wrap items-center gap-2">
            <button type="button" onclick="focusCityOnMap('Noida')" class="text-xs font-bold bg-slate-800 hover:bg-slate-700 text-teal-300 px-3 py-1.5 rounded-lg cursor-pointer">
              Noida
            </button>
            <button type="button" onclick="focusCityOnMap('Delhi')" class="text-xs font-bold bg-slate-800 hover:bg-slate-700 text-teal-300 px-3 py-1.5 rounded-lg cursor-pointer">
              Delhi
            </button>
            <button type="button" id="gpsBtn" onclick="detectCurrentLocation()" class="text-xs font-bold bg-teal-600 hover:bg-teal-500 text-white px-3 py-1.5 rounded-lg cursor-pointer inline-flex items-center gap-1.5">
              <i class="fa-solid fa-location-crosshairs"></i> Use Current Location
            </button>
          </div>
        </div>

        <input
          type="text"
          id="patientLocation"
          name="patientLocation"
          required
          placeholder="House / Flat No., Sector / Colony, Landmark, Noida or Delhi"
          class="w-full px-4 py-3 rounded-xl bg-slate-950/90 border border-slate-700 text-white placeholder-slate-500 focus:border-teal-400 focus:outline-none"
        />

        <input type="hidden" id="gpsMapLink" name="gpsMapLink" />

        <div id="mapPicker" class="w-full h-64 rounded-2xl overflow-hidden border border-slate-700 z-10"></div>

        <p id="locationStatus" class="hidden text-xs font-semibold text-teal-300"></p>
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button type="submit" class="w-full py-4 px-6 rounded-xl bg-teal-500 hover:bg-teal-400 text-slate-950 font-extrabold text-base transition shadow-lg cursor-pointer">
          Book a Home Visit on WhatsApp
        </button>
      </div>

    </form>
  </div>
</section>
