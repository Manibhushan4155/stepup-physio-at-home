<section id="appointment" class="py-20 bg-white">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-slate-900 text-white rounded-3xl p-8 sm:p-12 shadow-2xl">
      <div class="text-center mb-8">
        <span class="text-xs font-extrabold uppercase tracking-wider text-teal-400 bg-teal-950 px-3 py-1 rounded-full">Your Recovery Starts Here</span>
        <h2 class="text-3xl font-extrabold mt-3">Take the First Step Toward Better Movement</h2>
        <p class="text-slate-400 text-xs sm:text-sm mt-2">Select conditions, pick your slot, and share or pin your exact home location on the map.</p>
      </div>

      <form onsubmit="handleAppointmentSubmit(event)" class="space-y-5">
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-300 mb-1.5">Patient Name</label>
            <input type="text" id="patientName" required placeholder="e.g. Aman Sharma" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-teal-500">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-300 mb-1.5">Phone Number</label>
            <input type="tel" id="patientPhone" required placeholder="e.g. 9876543210" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-teal-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-300 mb-2">
            Service / Condition <span class="text-teal-400 font-normal normal-case">(Select one or multiple)</span>
          </label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
            <label class="flex items-center gap-2.5 bg-slate-800/90 border border-slate-700 hover:border-teal-500/60 px-3.5 py-2.5 rounded-xl cursor-pointer transition">
              <input type="checkbox" name="problemOption" value="Neck Pain / Back Pain" class="accent-teal-500 w-4 h-4 rounded">
              <span>Neck Pain / Back Pain</span>
            </label>
            <label class="flex items-center gap-2.5 bg-slate-800/90 border border-slate-700 hover:border-teal-500/60 px-3.5 py-2.5 rounded-xl cursor-pointer transition">
              <input type="checkbox" name="problemOption" value="Knee Pain" class="accent-teal-500 w-4 h-4 rounded">
              <span>Knee Pain</span>
            </label>
            <label class="flex items-center gap-2.5 bg-slate-800/90 border border-slate-700 hover:border-teal-500/60 px-3.5 py-2.5 rounded-xl cursor-pointer transition">
              <input type="checkbox" name="problemOption" value="Shoulder Pain / Frozen Shoulder" class="accent-teal-500 w-4 h-4 rounded">
              <span>Shoulder Pain / Frozen Shoulder</span>
            </label>
            <label class="flex items-center gap-2.5 bg-slate-800/90 border border-slate-700 hover:border-teal-500/60 px-3.5 py-2.5 rounded-xl cursor-pointer transition">
              <input type="checkbox" name="problemOption" value="Postoperative Rehab (TKR / THR)" class="accent-teal-500 w-4 h-4 rounded">
              <span>Postoperative Rehab (TKR / THR)</span>
            </label>
            <label class="flex items-center gap-2.5 bg-slate-800/90 border border-slate-700 hover:border-teal-500/60 px-3.5 py-2.5 rounded-xl cursor-pointer transition">
              <input type="checkbox" name="problemOption" value="Orthopaedic Rehabilitation" class="accent-teal-500 w-4 h-4 rounded">
              <span>Orthopaedic Rehabilitation</span>
            </label>
            <label class="flex items-center gap-2.5 bg-slate-800/90 border border-slate-700 hover:border-teal-500/60 px-3.5 py-2.5 rounded-xl cursor-pointer transition">
              <input type="checkbox" name="problemOption" value="Neurological Rehab (Stroke / Parkinsonism)" class="accent-teal-500 w-4 h-4 rounded">
              <span>Neurological Rehab (Stroke / Parkinsonism)</span>
            </label>
            <label class="flex items-center gap-2.5 bg-slate-800/90 border border-slate-700 hover:border-teal-500/60 px-3.5 py-2.5 rounded-xl cursor-pointer transition">
              <input type="checkbox" name="problemOption" value="Certified Cupping Therapy" class="accent-teal-500 w-4 h-4 rounded">
              <span>Certified Cupping Therapy</span>
            </label>
            <label class="flex items-center gap-2.5 bg-slate-800/90 border border-slate-700 hover:border-teal-500/60 px-3.5 py-2.5 rounded-xl cursor-pointer transition">
              <input type="checkbox" name="problemOption" value="Ergonomic / Geriatric Physiotherapy" class="accent-teal-500 w-4 h-4 rounded">
              <span>Ergonomic / Geriatric Physiotherapy</span>
            </label>
            <label class="sm:col-span-2 flex items-center gap-2.5 bg-slate-800/90 border border-teal-500/40 hover:border-teal-400 px-3.5 py-2.5 rounded-xl cursor-pointer transition">
              <input type="checkbox" id="otherProblemCheck" onchange="toggleOtherInput()" class="accent-teal-500 w-4 h-4 rounded">
              <span class="font-semibold text-teal-300">Other (Specify your condition below)</span>
            </label>
          </div>

          <div id="otherProblemBox" class="hidden mt-3">
            <input type="text" id="otherProblemText" placeholder="Type your problem or condition here (e.g. Sciatica, Slip Disc, Ankle Sprain)..." class="w-full bg-slate-800 border border-teal-500 rounded-xl px-4 py-3 text-sm text-white focus:outline-none">
          </div>
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-300 mb-1.5">Preferred Date</label>
            <input type="date" id="patientDate" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-teal-500">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-300 mb-1.5">Preferred Time Slot</label>
            <select id="patientSlot" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-teal-500">
              <option value="Morning (09:00 AM - 12:00 PM)">Morning (09:00 AM - 12:00 PM)</option>
              <option value="Afternoon (12:00 PM - 04:00 PM)">Afternoon (12:00 PM - 04:00 PM)</option>
              <option value="Evening (04:00 PM - 08:00 PM)">Evening (04:00 PM - 08:00 PM)</option>
              <option value="Flexible / Any Time Available">Flexible / Any Time Available</option>
            </select>
          </div>
        </div>

        <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-4 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <label class="block text-xs font-semibold uppercase text-slate-200">
              Home Location <span class="text-teal-400 font-normal normal-case">(Use Current GPS or Tap/Drag Pin on Map)</span>
            </label>
            <button type="button" id="gpsBtn" onclick="detectCurrentLocation()" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-950 bg-teal-400 hover:bg-teal-300 px-3.5 py-1.5 rounded-lg shadow transition">
              <i class="fa-solid fa-location-crosshairs"></i> Use Current Location
            </button>
          </div>

          <div id="mapPicker" class="w-full h-56 rounded-xl border border-slate-600 overflow-hidden"></div>
          <p class="text-[11px] text-slate-400 flex items-center gap-1.5">
            <i class="fa-solid fa-hand-pointer text-teal-400"></i> Tap anywhere on the map or drag the blue pin to mark your exact house/society.
          </p>

          <div>
            <input type="text" id="patientLocation" required placeholder="House/Flat No., Society, Sector (Noida or Delhi)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-teal-500">
          </div>

          <input type="hidden" id="gpsMapLink" value="">
          <p id="locationStatus" class="text-xs font-semibold text-teal-400 hidden"></p>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-300 mb-1.5">Selected Plan (Optional)</label>
          <input type="text" id="selectedPlan" placeholder="Standard / Advanced / Premium" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-teal-500">
        </div>

        <button type="submit" class="w-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-extrabold text-sm py-4 rounded-xl transition shadow-lg mt-2">
          Book a Home Visit on WhatsApp
        </button>
      </form>
    </div>
  </div>
</section>
